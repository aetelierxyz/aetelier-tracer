name: docker-build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-build-aetelier-tracer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/aetelierxyz/aetelier-tracer

jobs:
  build:
    name: build (amd64)
    if: github.repository == 'aetelierxyz/aetelier-tracer'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: docker build (native amd64)
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:${GITHUB_SHA::12}-amd64" .

  publish:
    name: publish (amd64 to ghcr)
    if: github.repository == 'aetelierxyz/aetelier-tracer' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ghcr login
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: build + push the commit sha, and the version tag on a tag push
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:${GITHUB_SHA::12}-amd64" .
          docker push "$IMAGE:${GITHUB_SHA::12}-amd64"
          case "$GITHUB_REF" in
            refs/tags/v*)
              docker tag "$IMAGE:${GITHUB_SHA::12}-amd64" "$IMAGE:${GITHUB_REF_NAME}-amd64"
              docker push "$IMAGE:${GITHUB_REF_NAME}-amd64"
              ;;
          esac
      - name: ghcr logout
        if: always()
        run: docker logout ghcr.io
