name: parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-mounts:
    name: the export, the frozen replay and the golden ledger must exist on the runner host
    if: github.repository == 'IteraLabs/aetelier-tracer'
    runs-on: [self-hosted, linux-amd64]
    env:
      FILLS_DIR: ${{ vars.TRACER_FILLS_DIR }}
      REPLAY_DIR: ${{ vars.TRACER_REPLAY_DIR }}
      GOLDEN_DIR: ${{ vars.TRACER_GOLDEN_DIR }}
    defaults:
      run:
        shell: bash
    steps:
      - name: repository variables name absolute host directories holding the inputs
        run: |
          set -euo pipefail
          for var in FILLS_DIR REPLAY_DIR GOLDEN_DIR; do
            dir="${!var}"
            if [ -z "$dir" ]; then
              echo "::error::repository variable TRACER_$var is unset"
              exit 1
            fi
            if [ "${dir:0:1}" != "/" ]; then
              echo "::error::repository variable TRACER_$var=$dir is not an absolute path"
              exit 1
            fi
            if [ ! -d "$dir" ]; then
              echo "::error::TRACER_$var=$dir does not exist on the runner host"
              exit 1
            fi
          done
          if [ -z "$(ls -A "$FILLS_DIR")" ]; then
            echo "::error::TRACER_FILLS_DIR=$FILLS_DIR is empty on the runner host"
            exit 1
          fi
          for f in corrected_ledger.json fillrates.json; do
            if [ ! -s "$REPLAY_DIR/$f" ]; then
              echo "::error::TRACER_REPLAY_DIR=$REPLAY_DIR has no non-empty $f on the runner host"
              exit 1
            fi
          done
          if [ ! -s "$GOLDEN_DIR/paper_trades_golden.csv" ]; then
            echo "::error::TRACER_GOLDEN_DIR=$GOLDEN_DIR has no non-empty paper_trades_golden.csv on the runner host"
            exit 1
          fi

  full-gates:
    name: full parity gates over the private study export
    if: github.repository == 'IteraLabs/aetelier-tracer'
    needs: host-mounts
    runs-on: [self-hosted, linux-amd64]
    container:
      image: rust:1.99-bookworm
      volumes:
        - ${{ vars.TRACER_FILLS_DIR }}:/fills:ro
        - ${{ vars.TRACER_REPLAY_DIR }}:/replay:ro
        - ${{ vars.TRACER_GOLDEN_DIR }}:/golden:ro
    env:
      TRACER_FILLS_DIR: /fills
      TRACER_REPLAY_DIR: /replay
      TRACER_GOLDEN_DIR: /golden
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: the frozen replay must match fixtures/frozen_replay.sha256
        run: |
          set -euo pipefail
          if ! (cd /replay && sha256sum --strict -c "$GITHUB_WORKSPACE/fixtures/frozen_replay.sha256"); then
            echo "::error::/replay (TRACER_REPLAY_DIR) does not match fixtures/frozen_replay.sha256"
            exit 1
          fi

      - name: the golden ledger must match fixtures/golden.sha256
        run: |
          set -euo pipefail
          if ! (cd /golden && sha256sum --strict -c "$GITHUB_WORKSPACE/fixtures/golden.sha256"); then
            echo "::error::/golden (TRACER_GOLDEN_DIR) does not match fixtures/golden.sha256"
            exit 1
          fi

      - name: golden and signals parity gates, full study
        run: cargo test --locked --workspace --no-fail-fast

      - name: hand the workspace back to the runner user
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$RUNNER_WORKSPACE")" "$GITHUB_WORKSPACE"
