name: ci

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:

  gates:
    name: fmt + check + clippy + tests (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aetelier-tracer
    steps:
      - uses: actions/checkout@v5
        with:
          path: aetelier-tracer

      - uses: actions/checkout@v5
        with:
          repository: IteraLabs/aetelier-sdk
          path: aetelier-sdk
          token: ${{ secrets.INTER_AETELIER_READ_PAT }}

      - uses: actions/checkout@v5
        with:
          repository: IteraLabs/aetelier-proto
          path: aetelier-proto
          token: ${{ secrets.INTER_AETELIER_READ_PAT }}

      - name: install build deps (protoc + librdkafka C deps)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libsasl2-dev \
            libzstd-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aetelier-tracer

      - name: cargo fmt (blocking, workspace members only)
        run: |
          set -e
          for p in $(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(" ".join(p["name"] for p in json.load(sys.stdin)["packages"]))'); do
            cargo fmt -p "$p" -- --check
          done

      - name: cargo check (blocking)
        run: cargo check --locked --workspace --all-targets

      - name: cargo clippy (blocking)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test (unit + integration + doc)
        run: cargo test --locked --workspace

  msrv:
    name: MSRV (1.88.0)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aetelier-tracer
    steps:
      - uses: actions/checkout@v5
        with:
          path: aetelier-tracer

      - uses: actions/checkout@v5
        with:
          repository: IteraLabs/aetelier-sdk
          path: aetelier-sdk
          token: ${{ secrets.INTER_AETELIER_READ_PAT }}

      - uses: actions/checkout@v5
        with:
          repository: IteraLabs/aetelier-proto
          path: aetelier-proto
          token: ${{ secrets.INTER_AETELIER_READ_PAT }}

      - name: install build deps (protoc + librdkafka C deps)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libcurl4-openssl-dev \
            libsasl2-dev \
            libzstd-dev

      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aetelier-tracer
          key: msrv

      - name: cargo check on the declared rust-version
        run: cargo check --locked --workspace

  deny:
    name: cargo deny (advisories + bans + licenses + sources)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: aetelier-tracer
    steps:
      - uses: actions/checkout@v5
        with:
          path: aetelier-tracer

      - uses: actions/checkout@v5
        with:
          repository: IteraLabs/aetelier-sdk
          path: aetelier-sdk
          token: ${{ secrets.INTER_AETELIER_READ_PAT }}

      - uses: actions/checkout@v5
        with:
          repository: IteraLabs/aetelier-proto
          path: aetelier-proto
          token: ${{ secrets.INTER_AETELIER_READ_PAT }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

  ci-green:
    name: ci-green
    if: always()
    needs: [gates, msrv, deny]
    runs-on: ubuntu-24.04
    steps:
      - name: assert every upstream job succeeded
        run: |
          echo 'gates=${{ needs.gates.result }}'
          echo 'msrv=${{ needs.msrv.result }}'
          echo 'deny=${{ needs.deny.result }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "::error::at least one ci job did not succeed"
            exit 1
          fi
