name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gates:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@9e3720000324bf314ab081346108fc3bab8d6b74
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo nextest run --locked --workspace
      - run: cargo test --locked --workspace --doc

  binaries:
    needs: gates
    strategy:
      matrix:
        include:
          - os: [self-hosted, Linux, X64]
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: build release binaries
        run: cargo build --locked --release -p aetelier-tracer --bin validate --bin rehydrate
      - name: package
        run: |
          set -euo pipefail
          mkdir -p dist
          for b in md_worker validate rehydrate; do
            cp "target/release/$b" "dist/${b}-${{ github.ref_name }}-${{ matrix.triple }}"
          done
      - name: attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber
