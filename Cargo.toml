[workspace]
resolver = "2"
members = ["tracer-engine", "tracerd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
publish = false

[workspace.dependencies]
aetelier-io = { path = "../aetelier-sdk/aetelier-io", features = ["parquet"] }
aetelier-types = { path = "../aetelier-sdk/aetelier-types" }
anyhow = "1"
axum = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracer-engine = { path = "tracer-engine" }
