[workspace]
resolver = "2"
members = ["tracer-engine", "tracerd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[workspace.dependencies]
aetelier-io = { git = "https://github.com/IteraLabs/aetelier-sdk", rev = "681a344e895f2b7bfa44cbbb032be9c535ba35e7", features = ["parquet"] }
aetelier-types = { git = "https://github.com/IteraLabs/aetelier-sdk", rev = "681a344e895f2b7bfa44cbbb032be9c535ba35e7" }
anyhow = "1"
arrow-schema = "57.2"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
parquet = "57.2"
sha2 = "0.10"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
rust_decimal = "1.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracer-engine = { path = "tracer-engine" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = "1"
