[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable; no maintained release or safe upgrade exists" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained, not vulnerable; no maintained release or safe upgrade exists" },
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/aetelierxyz/aetelier-sdk"]
